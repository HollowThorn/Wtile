name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Wtile.slnx

      - name: Build
        run: dotnet build Wtile.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Wtile.Tests/Wtile.Tests.csproj -c Release --no-build
